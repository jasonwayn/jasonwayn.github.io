<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" aria-labelledby="title description">
  <title id="title">Weight versus KV streaming on a mobile UMA system</title>
  <desc id="description">CPU I/O workers read prebuilt transformed weights from UFS into DRAM staging and fill a GPU-held weight copy, which is later freed without writeback. GPU-updated KV resides in a mapped DRAM pool; the CPU snapshots dirty ranges and writes them to fixed offsets in a UFS backing file. Refill reads valid KV directly from UFS into the mapped pool. CPU, GPU, and NPU share LPDDR DRAM. No device-level UFS cache is asserted.</desc>
  <defs>
    <marker id="blue-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#315c85"/>
    </marker>
    <marker id="red-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a74343"/>
    </marker>
  </defs>
  <style>
    .background { fill: #fff; }
    .band { fill: #faf9f6; stroke: #a8adb2; stroke-width: 1.4; }
    .block { fill: #fff; stroke: #4e5863; stroke-width: 1.5; }
    .weight { fill: #eef3f8; stroke: #315c85; stroke-width: 1.5; }
    .kv { fill: #fcf1f0; stroke: #a74343; stroke-width: 1.5; }
    .note-box { fill: #f6f5f2; stroke: #8e959c; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .neutral-link { fill: none; stroke: #adb3b9; stroke-width: 1.5; }
    .weight-link { fill: none; stroke: #315c85; stroke-width: 3; marker-end: url(#blue-tip); }
    .kv-link { fill: none; stroke: #a74343; stroke-width: 3; marker-end: url(#red-tip); }
    .free-link { fill: none; stroke: #808992; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .title { font: 600 24px ui-sans-serif, system-ui, sans-serif; fill: #20252a; }
    .band-label { font: 600 18px ui-sans-serif, system-ui, sans-serif; fill: #20252a; }
    .label { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #20252a; }
    .sub { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #5b6570; }
    .blue-label { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #315c85; }
    .red-label { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #a74343; }
    .footnote { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #5b6570; }
  </style>

  <rect class="background" width="920" height="700"/>
  <text class="title" x="30" y="38">Weight vs KV streaming on mobile UMA</text>

  <!-- Processing units. The I/O workers execute on the CPU, not in DRAM. -->
  <rect class="block" x="40" y="68" width="245" height="86" rx="6"/>
  <text class="label" x="162.5" y="105" text-anchor="middle">CPU · I/O workers</text>
  <text class="sub" x="162.5" y="127" text-anchor="middle">pread / pwrite / scheduling</text>
  <rect class="block" x="335" y="68" width="300" height="86" rx="6"/>
  <text class="label" x="485" y="105" text-anchor="middle">Adreno GPU · target compute</text>
  <text class="sub" x="485" y="127" text-anchor="middle">uses logical weight and KV buffers</text>
  <rect class="block" x="685" y="68" width="195" height="86" rx="6"/>
  <text class="label" x="782.5" y="105" text-anchor="middle">Hexagon NPU</text>
  <text class="sub" x="782.5" y="127" text-anchor="middle">not on these offload paths</text>
  <path class="neutral-link" d="M 162 154 V 194"/>
  <path class="neutral-link" d="M 485 154 V 194"/>
  <path class="neutral-link" d="M 783 154 V 194"/>

  <!-- These are logical GPU allocations in the same physical system DRAM. -->
  <rect class="band" x="30" y="194" width="860" height="268" rx="7"/>
  <text class="band-label" x="50" y="226">Shared LPDDR DRAM (UMA)</text>
  <text class="sub" x="50" y="245">GPU-held buffers and CPU staging occupy the same system memory.</text>

  <rect class="weight" x="75" y="270" width="255" height="66" rx="5"/>
  <text class="label" x="202.5" y="298" text-anchor="middle">GPU-held weight copy</text>
  <text class="sub" x="202.5" y="319" text-anchor="middle">read-only · OpenCL slot</text>
  <rect class="weight" x="75" y="375" width="255" height="66" rx="5"/>
  <text class="label" x="202.5" y="403" text-anchor="middle">Weight I/O staging</text>
  <text class="sub" x="202.5" y="424" text-anchor="middle">CPU worker reads into DRAM</text>

  <!-- Releasing a weight slot is not a data transfer to UFS. -->
  <path class="free-link" d="M 330 303 H 354"/>
  <rect class="note-box" x="354" y="275" width="180" height="56" rx="5"/>
  <text class="label" x="444" y="298" text-anchor="middle">free GPU copy</text>
  <text class="sub" x="444" y="318" text-anchor="middle">no UFS writeback</text>

  <rect class="kv" x="590" y="270" width="250" height="66" rx="5"/>
  <text class="label" x="715" y="298" text-anchor="middle">Mapped KV pool</text>
  <text class="sub" x="715" y="319" text-anchor="middle">GPU-updated K/V in DRAM</text>
  <rect class="kv" x="590" y="375" width="250" height="66" rx="5"/>
  <text class="label" x="715" y="403" text-anchor="middle">Dirty-range snapshot</text>
  <text class="sub" x="715" y="424" text-anchor="middle">CPU memcpy after GPU fence</text>

  <!-- Storage files. A device-level fast cache is deliberately not depicted. -->
  <rect class="band" x="30" y="526" width="860" height="128" rx="7"/>
  <text class="band-label" x="460" y="552" text-anchor="middle">UFS flash storage</text>
  <rect class="weight" x="75" y="556" width="255" height="70" rx="5"/>
  <text class="label" x="202.5" y="584" text-anchor="middle">Prebuilt transformed weights</text>
  <text class="sub" x="202.5" y="607" text-anchor="middle">read-only O_DIRECT file</text>
  <rect class="kv" x="590" y="556" width="250" height="70" rx="5"/>
  <text class="label" x="715" y="584" text-anchor="middle">KV backing file</text>
  <text class="sub" x="715" y="607" text-anchor="middle">fixed-offset O_DIRECT I/O</text>

  <!-- Weight: O_DIRECT pread to host stage, then OpenCL fill to logical GPU slot. -->
  <path class="weight-link" d="M 165 556 V 441"/>
  <text class="blue-label" x="177" y="502">O_DIRECT pread</text>
  <path class="weight-link" d="M 205 375 V 336"/>
  <text class="blue-label" x="215" y="361">OpenCL fill</text>

  <!-- KV writeback: mapped pool -> CPU snapshot -> fixed UFS file offsets. -->
  <path class="kv-link" d="M 635 336 V 375"/>
  <text class="red-label" x="647" y="360">snapshot dirty bytes</text>
  <path class="kv-link" d="M 660 441 V 556"/>
  <text class="red-label" x="486" y="505">KV dirty pwrite</text>

  <!-- KV refill: worker pread writes directly into the mapped pool, not a second upload. -->
  <path class="kv-link" d="M 815 556 H 864 V 303 H 840"/>
  <text class="red-label" x="676" y="482">KV refill: direct pread</text>

  <text class="footnote" x="30" y="682">No direct GPU–UFS path. No weight writeback. Device-level UFS cache omitted until measured.</text>
</svg>
